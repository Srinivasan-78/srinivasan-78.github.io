<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="How the site is put together: a static page in the browser, files from GitHub Pages, a chat worker on Cloudflare, and two outside services">
  <style>
    .bg { fill: #0b0c0f; }
    .panel { fill: #121214; stroke: #2a2b31; stroke-width: 2; }
    .panel-accent { fill: #101a26; stroke: #2997ff; stroke-width: 2; }
    .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #f5f5f7; }
    .h { font-size: 21px; font-weight: 600; }
    .s { font-size: 15px; fill: #a1a1a6; }
    .k { font-size: 13px; fill: #6e6e73; letter-spacing: .08em; text-transform: uppercase; }
    .a { font-size: 14px; fill: #2997ff; }
    .line { stroke: #3a3b42; stroke-width: 2.5; fill: none; }
    .line-a { stroke: #2997ff; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 7; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" rx="18" />

  <text class="t k" x="60" y="56">The whole site in one picture</text>

  <!-- Visitor -->
  <rect class="panel" x="60" y="90" width="230" height="140" rx="14" />
  <text class="t h" x="86" y="140">A visitor</text>
  <text class="t s" x="86" y="170">Any browser, phone</text>
  <text class="t s" x="86" y="192">or laptop</text>

  <!-- The page -->
  <rect class="panel-accent" x="380" y="70" width="330" height="180" rx="14" />
  <text class="t h" x="410" y="120">The page itself</text>
  <text class="t s" x="410" y="150">Ready-made HTML, CSS</text>
  <text class="t s" x="410" y="172">and JavaScript. No server</text>
  <text class="t s" x="410" y="194">is thinking anywhere.</text>
  <text class="t a" x="410" y="224">served by GitHub Pages</text>

  <!-- Files -->
  <rect class="panel" x="800" y="80" width="340" height="160" rx="14" />
  <text class="t h" x="828" y="128">GitHub Pages</text>
  <text class="t s" x="828" y="158">Holds the finished files and</text>
  <text class="t s" x="828" y="180">hands them over as they are.</text>
  <text class="t a" x="828" y="210">www.srinidevops.com</text>

  <path class="line" d="M290 160 H372" />
  <path class="line" d="M364 152 l10 8 -10 8" />
  <path class="line" d="M792 160 H714" />
  <path class="line" d="M722 152 l-10 8 10 8" />
  <text class="t s" x="716" y="140">sends the files</text>

  <!-- Chat worker -->
  <rect class="panel" x="380" y="320" width="330" height="170" rx="14" />
  <text class="t h" x="410" y="368">Chat worker</text>
  <text class="t s" x="410" y="398">A tiny program on Cloudflare.</text>
  <text class="t s" x="410" y="420">It is the only thing that holds</text>
  <text class="t s" x="410" y="442">the AI key.</text>
  <text class="t a" x="410" y="472">origin check · 15 requests / min</text>
  <text class="t s" x="556" y="292">a chat question</text>

  <!-- Gemini -->
  <rect class="panel" x="800" y="300" width="340" height="90" rx="14" />
  <text class="t h" x="828" y="345">Gemini</text>
  <text class="t s" x="828" y="371">Writes the chat answers.</text>

  <!-- Formspree -->
  <rect class="panel" x="800" y="420" width="340" height="90" rx="14" />
  <text class="t h" x="828" y="465">Formspree</text>
  <text class="t s" x="828" y="491">Emails the contact form on.</text>

  <path class="line-a" d="M545 250 V312" />
  <path class="line-a" d="M537 304 l8 10 8 -10" />
  <path class="line-a" d="M710 380 H792" />
  <path class="line-a" d="M784 372 l10 8 -10 8" />
  <path class="line dash" d="M400 250 C360 262 345 274 345 306 V534 H784 V478" />
  <path class="line" d="M776 486 l8 -10 8 10" />
  <text class="t s" x="420" y="524">the contact form, when you send one</text>

  <text class="t s" x="60" y="352">Nothing here contacts</text>
  <text class="t s" x="60" y="374">anyone else until you</text>
  <text class="t s" x="60" y="396">do something that</text>
  <text class="t s" x="60" y="418">needs it — a question,</text>
  <text class="t s" x="60" y="440">or a message.</text>
</svg>
