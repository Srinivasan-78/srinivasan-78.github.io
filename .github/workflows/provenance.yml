name: provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
      - name: REUSE / SPDX compliance
        run: pipx run reuse lint

