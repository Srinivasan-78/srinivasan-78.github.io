name: Deploy

# One clean pipeline to build and publish the static portfolio to GitHub Pages.
#
# `push` makes a merge to main the deploy trigger; workflow_dispatch stays so a
# publish can still be forced without a commit (a secret rotation, a re-run of a
# failed deploy). Both land in the same concurrency group, so a manual run and a
# push cannot race each other onto Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      # `next build` runs tsc itself, so a type error already fails the build.
      # Lint did not run anywhere before this, which is the gap: it is the only
      # check that catches the accessibility and hook rules in
      # eslint-config-next, and nothing was enforcing them on the way to Pages.
      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: out

  publish:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
