name: authormark
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
      - name: Verify authorship watermarks
        uses: Srinivasan-78/authormark-watch@12751c7712c969edbb8c50da8599cbc70c19b828  # main
        with:
          key: ${{ secrets.AUTHORMARK_KEY }}
          mode: check-presence
          path: .
